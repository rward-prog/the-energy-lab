<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Energy Lab</title>
<link rel="icon" href="data:,">
<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('app'); if (!el) return;
  var box = document.createElement('div');
  box.style.cssText = 'margin:16px;padding:14px;border:3px solid #C23B3B;border-radius:12px;background:#fff;color:#1B2A49;font:16px/1.45 sans-serif';
  box.innerHTML = '<b>Energy Lab hit a problem while loading.</b><br>Please send this message to Mr. Ward:<br><code style="word-break:break-all">' +
    String(e.message || e.error) + ' (line ' + e.lineno + ', ' + navigator.userAgent + ')</code>';
  el.appendChild(box);
});
</script>
<style>
:root{
  --ink:#1B2A49; --paper:#E8F1F7; --grid:#D5E3EE; --card:#FFFFFF; --line:#C0D0DF; --muted:#4F5F7C;
  --red:#C4161C; --check-ink:#FFFFFF; --pri-bg:#1B2A49; --pri-fg:#FFFFFF; --good:#1F8A4C; --bad:#C23B3B; --star:#F2A100; --soft:#F3F8FC;
  --display:'Arial Rounded MT Bold','Avenir Next','Trebuchet MS',system-ui,sans-serif;
  --body:'Trebuchet MS','Segoe UI',Tahoma,system-ui,sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#EAF1FB; --paper:#12203A; --grid:#193052; --card:#1D2F50; --line:#3A5078; --muted:#A9B9D3;
    --red:#FF7070; --check-ink:#0B2A1A; --pri-bg:#EAF1FB; --pri-fg:#12203A; --good:#52C98A; --bad:#FF7B7B; --star:#FFC233; --soft:#162743;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body); color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px; min-height:100vh; line-height:1.4; font-size:16px;
}
button{font-family:inherit; color:inherit}
h1,h2,h3{font-family:var(--display); margin:0; font-weight:400; letter-spacing:.2px}
.wrap{max-width:1000px; margin:0 auto; padding:14px 14px 40px}
:focus-visible{outline:3px solid #2F6FDE; outline-offset:2px}

/* top bar */
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:6px 0 12px}
.bar .brand{display:flex; align-items:center; gap:8px; font-family:var(--display); font-size:20px; cursor:pointer; background:none; border:0; padding:0}
.bar .spacer{flex:1}
.pill{background:var(--card); border:2px solid var(--ink); border-radius:999px; padding:4px 12px; font-size:14px}
.btn{background:var(--card); border:2px solid var(--ink); border-radius:12px; padding:9px 16px; font-family:var(--display); font-size:15px; cursor:pointer}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--pri-bg); color:var(--pri-fg)}
.btn.small{padding:5px 11px; font-size:13px; border-radius:10px}

/* chips */
.chip{display:inline-block; background:var(--c); color:var(--ink-c); padding:3px 10px; border-radius:999px; font-size:13px; line-height:1.25; white-space:nowrap; border:1.5px solid rgba(0,0,0,.18)}
.chip.sm{font-size:11.5px; padding:2px 8px}

/* murphy */
.say{display:flex; gap:12px; align-items:flex-start}
.murphy{flex:none; width:var(--s,64px); height:var(--s,64px)}
.murphy svg,.murphy img{width:100%; height:100%; display:block; object-fit:contain}
.bubble{background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:10px 14px; position:relative; max-width:70ch; flex:1}
.bubble:before{content:''; position:absolute; left:-9px; top:18px; width:14px; height:14px; background:var(--card); border-left:2px solid var(--ink); border-bottom:2px solid var(--ink); transform:rotate(45deg)}
.bubble.good{border-color:var(--good)} .bubble.good:before{border-color:var(--good)}
.bubble.bad{border-color:var(--bad)} .bubble.bad:before{border-color:var(--bad)}
.bubble p{margin:0}

/* home */
.hero{display:flex; align-items:center; gap:20px; justify-content:space-between; flex-wrap:wrap; padding:18px 0 8px}
.hero h1{font-size:clamp(42px,9vw,78px); line-height:1}
.hero .sub{margin:8px 0 14px; color:var(--muted)}
.types{display:flex; flex-wrap:wrap; gap:6px; max-width:520px}
.types .chip{font-size:14px; animation:pass 10s infinite; animation-delay:calc(var(--i) * 1s)}
@keyframes pass{0%,10%{transform:translateY(-5px); box-shadow:0 5px 0 rgba(0,0,0,.18)} 14%,100%{transform:none; box-shadow:none}}
.who{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:18px 0 8px}
.who select{font:inherit; padding:10px 12px; border:2px solid var(--ink); border-radius:12px; background:var(--card); color:var(--ink); min-width:210px}
.homebtns{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}

/* map */
.sec{margin:26px 0 10px} .sec h2{font-size:26px} .sec p{margin:4px 0 0; color:var(--muted)}
.phase{font-size:17px; margin:18px 0 8px; color:var(--muted)}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px}
.tile{background:var(--card); border:2px solid var(--ink); border-radius:14px; padding:12px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:3px; min-height:118px}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile .num{font-family:var(--display); font-size:13px; color:var(--muted)}
.tile .tt{font-family:var(--display); font-size:17px; line-height:1.15}
.tile .bl{font-size:13px; color:var(--muted); flex:1}
.tile.locked{opacity:.5; cursor:not-allowed; border-style:dashed}
.stars{font-size:20px; letter-spacing:2px; color:var(--line)} .stars .on{color:var(--star)}
.learnbar{display:flex; gap:14px; align-items:center; background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:14px 16px; margin-top:12px; cursor:pointer; text-align:left; width:100%}
.learnbar .tt{font-family:var(--display); font-size:19px}
.learnbar .bl{color:var(--muted); font-size:14px}
.teacher{margin-top:34px; padding-top:14px; border-top:2px dashed var(--line); display:flex; gap:10px; flex-wrap:wrap; align-items:center; color:var(--muted); font-size:14px}

/* learn */
.lgroup{margin:22px 0 8px; font-family:var(--display); font-size:18px; color:var(--muted)}
.lgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px}

/* spot */
.qcard{background:var(--card); border:2px solid var(--ink); border-radius:18px; padding:18px; margin:12px 0}
.qcard .q{font-size:clamp(18px,3.2vw,23px); line-height:1.35; margin:0 0 14px}
.prog{display:flex; gap:6px; margin:6px 0 2px}
.prog i{flex:1; height:8px; border-radius:6px; background:var(--line)} .prog i.done{background:var(--good)} .prog i.cur{background:var(--ink)}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px}
.opt{border:2.5px solid var(--ink); border-radius:14px; padding:13px 12px; font-family:var(--display); font-size:16px; cursor:pointer; text-align:center; min-height:54px}
.opt.energy{background:var(--c); color:var(--ink-c)}
.opt.text{background:var(--card); text-align:left; font-family:var(--body); font-size:16px}
.opt.sel{outline:4px solid #2F6FDE; outline-offset:2px}
.opt.right{border-color:var(--good); box-shadow:0 0 0 4px rgba(31,138,76,.35)}
.opt.wrong{opacity:.4; text-decoration:line-through}
.opt:disabled{cursor:default}
.actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap}

/* build */
.help{color:var(--muted); font-size:14px; margin:6px 0 10px}
.goalbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0 6px}
.chain{position:relative; display:flex; flex-wrap:wrap; align-items:stretch; gap:8px; padding:18px 14px 26px; background:var(--soft); border:2px dashed var(--line); border-radius:20px}
.arrow{align-self:center; font-size:22px; color:var(--muted)}
.node{position:relative; width:122px; min-height:168px; border:2.5px solid var(--ink); border-radius:14px; background:var(--card); padding:8px 6px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transition:box-shadow .2s, border-color .2s}
.node .tag{position:absolute; top:-11px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-size:11px; padding:1px 9px; border-radius:99px; font-family:var(--display); white-space:nowrap}
.node.slot.empty{border-style:dashed; background:transparent; color:var(--muted); font-size:13px}
.node.slot.over{background:rgba(47,111,222,.18); border-color:#2F6FDE}
.node.locked{background:repeating-linear-gradient(135deg,var(--card),var(--card) 9px,var(--soft) 9px,var(--soft) 18px)}
.node .lock{position:absolute; top:4px; right:6px; font-size:14px}
.node.ok{border-color:var(--good); box-shadow:0 0 0 4px rgba(31,138,76,.3)}
.node.bad{border-color:var(--bad); box-shadow:0 0 0 4px rgba(194,59,59,.3); animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.amt{position:absolute; bottom:-15px; left:50%; transform:translateX(-50%); background:var(--card); border:2px solid var(--ink); border-radius:99px; padding:0 8px; font-size:12px; font-family:var(--display); white-space:nowrap; z-index:3}
.piece{display:flex; flex-direction:column; align-items:center; gap:3px; user-select:none; -webkit-user-select:none}
.piece[data-drag]{cursor:grab; touch-action:none}
.piece .ic{font-size:30px; line-height:1.1}
.piece .nm{font-size:12px; line-height:1.15; min-height:28px; display:flex; align-items:center}
.piece .io{display:flex; flex-direction:column; align-items:center; gap:1px}
.piece .dn{font-size:11px; line-height:1; color:var(--muted)}
.piece .eff{font-size:11px; color:var(--muted)}
.piece .note{font-size:11px; color:var(--muted); font-style:italic}
.piece .mystery{font-family:var(--display); font-size:22px; color:var(--muted); line-height:1.4}
.tray{display:flex; flex-wrap:wrap; gap:10px; padding:14px; border:2px solid var(--line); border-radius:16px; min-height:110px; margin-top:6px; background:var(--card)}
.tray .piece{width:124px; background:var(--card); border:2.5px solid var(--ink); border-radius:14px; padding:8px 6px; justify-content:flex-start}
.tray .empty-note{color:var(--muted); align-self:center; margin:auto}
.lifted{opacity:.35}
.ghost{position:fixed; z-index:60; pointer-events:none; opacity:.95; transform:rotate(-3deg) scale(1.06); box-shadow:0 10px 24px rgba(0,0,0,.3); background:var(--card); border:2.5px solid var(--ink); border-radius:14px; padding:8px 6px}
.orb{position:absolute; width:30px; height:30px; border-radius:50%; background:#fff; border:3px solid var(--ink); z-index:5; pointer-events:none; transition:left .6s ease, top .6s ease, background-color .35s; box-shadow:0 0 0 7px rgba(255,255,255,.55)}
.now{margin:10px 0 0; min-height:26px; font-family:var(--display); font-size:16px}
.readout{margin-top:12px}
.meter{display:flex; height:26px; border:2px solid var(--ink); border-radius:10px; overflow:hidden; margin:8px 0 4px; background:var(--card)}
.meter .got{background:var(--good); color:#fff; display:flex; align-items:center; padding-left:8px; font-size:13px; white-space:nowrap}
.meter .lost{background:var(--bad); color:#fff; display:flex; align-items:center; padding-left:8px; font-size:13px; white-space:nowrap; overflow:hidden}
.meterkey{font-size:13px; color:var(--muted)}

/* overlay */
.ov{position:fixed; inset:0; background:rgba(10,20,40,.62); display:flex; align-items:center; justify-content:center; padding:16px; z-index:100}
.modal{background:var(--card); border:3px solid var(--ink); border-radius:22px; padding:22px; max-width:480px; width:100%; text-align:center}
.modal h2{font-size:28px; margin-bottom:4px}
.modal .stars{font-size:46px; margin:4px 0 8px}
.modal p{margin:6px 0}
.modal .actions{justify-content:center}
.chainline{font-size:26px; margin:8px 0; word-break:break-word}

@media (max-width:640px){
  .node{width:98px; min-height:150px} .tray .piece{width:104px} .piece .ic{font-size:26px}
  .arrow{font-size:16px} .bubble:before{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{animation:none !important; transition:none !important}
}

.endgrp{display:flex; align-items:stretch; gap:8px}
.endgrp .arrow{align-self:center}
.tray > div{display:flex}

.murphy img{border-radius:50%; border:2.5px solid var(--ink); background:var(--card)}
.hero .murphy img{border-width:4px; box-shadow:0 6px 0 rgba(0,0,0,.14)}

/* energy notes */
.lcard{background:var(--card); border:2px solid var(--ink); border-left-width:12px; border-left-color:var(--c); border-radius:14px; padding:12px 14px; text-align:left}
.lcard .tt{font-family:var(--display); font-size:19px}
.lcard .tx{margin:4px 0 10px}
.redbox{border:2.5px dashed var(--red); border-radius:12px; padding:10px 12px; background:rgba(196,22,28,.06)}
@media (prefers-color-scheme: dark){ .redbox{background:rgba(255,112,112,.09)} }
.rlabel{font-family:var(--display); font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--red)}
.rwords{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px}
.rword{font-family:var(--display); font-size:18px; color:var(--red); border-bottom:3px solid var(--red); line-height:1.2}
.rrule{margin:4px 0 0; color:var(--red); font-weight:700; font-size:16.5px}
.lcard .more{margin:10px 0 0; padding-left:20px; color:var(--muted); font-size:14.5px}
.lcard .ex{margin-top:10px; padding:8px 10px; background:var(--soft); border-radius:10px; font-size:14px}
.notecheck{margin-top:26px; padding-top:16px; border-top:2px dashed var(--line)}

.lcard .remember{margin:2px 0 0}

/* finished levels */
.tile{position:relative}
.tile.done{border-color:var(--good); box-shadow:0 0 0 3px rgba(31,138,76,.22)}
.tile .check{position:absolute; top:8px; right:8px; width:44px; height:44px; border-radius:50%; background:var(--good); color:var(--check-ink); font-size:30px; font-weight:700; line-height:44px; text-align:center; box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile.done .tt{padding-right:46px}
.tile.done .num{padding-right:46px}

.qmark{display:inline-block; font-family:var(--display); font-size:17px; color:var(--muted); padding:0 14px; border:2px dashed var(--line); border-radius:99px; line-height:1.3}

</style>
</head>
<body>
<div class="wrap" id="app"><p style="padding:24px;font:18px sans-serif">Loading Energy Lab&hellip; <noscript>(This game needs JavaScript turned on.)</noscript></p></div>
<script>
/* ===== ENERGY LAB — DATA & RULES ===== */

const ROSTER = ["Michael","Raza","Aaran","Samuel","James","Giorgio","Dylan","Jasper","Elliott","Theodore","Taran","Pierce","Arthur","Alex","Thomas","Nicolas","Edward","Luca","Maxwell","Frederick","Justice","Andrew","Nicholas","Marty","Leo","Ayan","Charles","Anthony","Harry","Cole","Lucas","Jairam","Marcus","Alfred","Zane","Graham","Kailash","George","Douglass","Ellison","Wallace","Ethan"];

const ENERGY = {
  gpe:     { name:'Gravitational PE', short:'Gravity PE', color:'#2F6FDE', ink:'#FFFFFF' },
  elastic: { name:'Elastic PE',       short:'Elastic PE', color:'#8E4FD8', ink:'#FFFFFF' },
  chem:    { name:'Chemical PE',      short:'Chemical PE',color:'#25833F', ink:'#FFFFFF' },
  ke:      { name:'Kinetic',          short:'Kinetic',    color:'#F08A1C', ink:'#1B2A49' },
  thermal: { name:'Thermal',          short:'Thermal',    color:'#D93A3F', ink:'#FFFFFF' },
  sound:   { name:'Sound',            short:'Sound',      color:'#0F8F89', ink:'#FFFFFF' },
  radiant: { name:'Radiant',          short:'Radiant',    color:'#F5C518', ink:'#1B2A49' },
  electric:{ name:'Electric',         short:'Electric',   color:'#2CB5F2', ink:'#1B2A49' },
  nuclear: { name:'Nuclear',          short:'Nuclear',    color:'#B82B85', ink:'#FFFFFF' }
};

/* ---------- Build It pieces ---------- */
// Sources start a chain. Parts change one energy into another (eff = share that gets through).
const SOURCES = {
  ball:    { name:'Bowling ball on a high shelf', icon:'🎳', out:'gpe' },
  sling:   { name:'Stretched slingshot',          icon:'🏹', out:'elastic' },
  donut:   { name:'A donut',                      icon:'🍩', out:'chem' },
  wood:    { name:'Firewood',                     icon:'🪵', out:'chem' },
  battery: { name:'Fresh battery pack',           icon:'🔋', out:'chem' },
  murphy:  { name:'Murphy sprinting',             icon:'🐕', out:'ke' },
  wind:    { name:'Strong wind',                  icon:'🌬️', out:'ke' },
  sun:     { name:'Sunshine',                     icon:'☀️', out:'radiant' },
  uranium: { name:'Uranium fuel',                 icon:'⚛️', out:'nuclear' },
  outlet:  { name:'Wall outlet',                  icon:'🔌', out:'electric' }
};

const PARTS = {
  ramp:      { name:'Roll down a ramp',       icon:'🛝', in:'gpe',     out:'ke',      eff:.90 },
  release:   { name:'Let go of the spring',   icon:'🪀', in:'elastic', out:'ke',      eff:.90 },
  eatrun:    { name:'Eat, then run',          icon:'🏃', in:'chem',    out:'ke',      eff:.60, from:['donut','plant'], note:'Needs food' },
  burn:      { name:'Campfire',               icon:'🔥', in:'chem',    out:'thermal', eff:.80, from:['wood'], note:'Needs fuel to burn' },
  circuit:   { name:'Close the circuit',      icon:'⚡', in:'chem',    out:'electric',eff:.90, from:['battery'], note:'Needs a battery' },
  generator: { name:'Hand-crank generator',   icon:'⚙️', in:'ke',      out:'electric',eff:.80 },
  striker:   { name:'Hammer & bell',          icon:'🔨', in:'ke',      out:'sound',   eff:.70 },
  brake:     { name:'Brake pads',             icon:'🛑', in:'ke',      out:'thermal', eff:.90 },
  press:     { name:'Squish a spring',        icon:'🗜️', in:'ke',      out:'elastic', eff:.85 },
  pulley:    { name:'Pulley lift',            icon:'🏗️', in:'ke',      out:'gpe',     eff:.80 },
  turbine:   { name:'Steam turbine',          icon:'🌀', in:'thermal', out:'ke',      eff:.40 },
  reactor:   { name:'Nuclear reactor',        icon:'☢️', in:'nuclear', out:'thermal', eff:.90 },
  solar:     { name:'Solar panel',            icon:'🔆', in:'radiant', out:'electric',eff:.60 },
  absorb:    { name:'Dark surface soaks up rays', icon:'🍲', in:'radiant', out:'thermal', eff:.80 },
  plant:     { name:'Plant grows',            icon:'🌱', in:'radiant', out:'chem',    eff:.30 },
  bulb:      { name:'Light bulb',             icon:'💡', in:'electric',out:'radiant', eff:.50 },
  toaster:   { name:'Toaster',                icon:'🍞', in:'electric',out:'thermal', eff:.95 },
  buzzer:    { name:'Buzzer',                 icon:'🔊', in:'electric',out:'sound',   eff:.60 },
  microwave: { name:'Microwave oven',         icon:'📡', in:'electric',out:'radiant', eff:.60 },

  // Fake parts: they look like gadgets but cannot pass energy along
  duck:  { name:'Rubber duck',    icon:'🦆', dud:true },
  clip:  { name:'Paper clip',     icon:'📎', dud:true },
  sock:  { name:'Lonely sock',    icon:'🧦', dud:true },
  box:   { name:'Cardboard box',  icon:'📦', dud:true },
  pencil:{ name:'Pencil',         icon:'✏️', dud:true },
  plush: { name:'Stuffed bear',   icon:'🧸', dud:true },
  cone:  { name:'Traffic cone',   icon:'🚧', dud:true }
};

const GOALS = {
  bell:  { name:'Ring the bell',          icon:'🔔', needs:'sound' },
  lamp:  { name:'Light the lamp',         icon:'💡', needs:'radiant' },
  toast: { name:'Toast the bread',        icon:'🍞', needs:'thermal' },
  marsh: { name:'Melt the marshmallow',   icon:'🍡', needs:'thermal' },
  soup:  { name:'Warm the soup',          icon:'🍲', needs:'thermal' },
  ice:   { name:'Melt the ice',           icon:'🧊', needs:'thermal' },
  flag:  { name:'Raise the flag',         icon:'🚩', needs:'gpe' },
  city:  { name:'Light up the city',      icon:'🌆', needs:'radiant' }
};

/* ---------- Build It levels ---------- */
// start: fixed energy source (or null = student picks a source from the tray)
// leak: true = every part loses some energy as heat; goal needs at least `need` of 100 units
// fixed: { slotIndex: partId } locked pieces already in the machine
// blind: on expert levels the efficiency numbers (keeps %) stay hidden too, until energy types are revealed
const BUILD = [
  { id:'b1', phase:'Warm-up: build the chain (watch out for fake parts)', title:'Doorbell Drop',
    story:'{n1} cannot reach the doorbell, but a bowling ball is sitting on a high shelf. Build a chain so the ball\u2019s energy rings the bell.',
    start:'ball', goal:'bell', tray:['ramp','striker','duck','clip'], slots:3,
    hint:'Gravitational energy has to become kinetic before a hammer can swing.' },
  { id:'b2', title:'Murphy\u2019s Wheel',
    story:'Murphy is sprinting on his wheel again. Use his running to light {n1}\u2019s reading lamp.',
    start:'murphy', goal:'lamp', tray:['generator','bulb','sock'], slots:3,
    hint:'Motion can be turned into electric energy. Then electric energy can make light.' },
  { id:'b3', title:'Toast Time',
    story:'The power is out in {n1}\u2019s kitchen. All that is left is a fresh battery pack. Get that toast made!',
    start:'battery', goal:'toast', tray:['circuit','toaster','box','pencil'], slots:3,
    hint:'A battery stores chemical energy. Closing the circuit lets it flow as electric energy.' },
  { id:'b4', phase:'Decoys: some parts do not belong', title:'Campfire Marshmallow',
    story:'{n1} and {n2} want to melt a marshmallow. Careful: not every part helps.',

/* ---------- Simulation ---------- */
const fmt = n => Math.round(n * 10) / 10;

function simulate(L, chain) {
  const steps = [];
  let energy = null, amount = 100;
  if (L.start) {
    energy = SOURCES[L.start].out;
    steps.push({ slot:-1, id:L.start, kind:'start', out:energy, amount });
  }
  for (let k = 0; k < chain.length; k++) {
    const id = chain[k];
    if (!id) {
      if (chain.slice(k + 1).some(Boolean)) {
        return { ok:false, steps, brokeAt:k, msg:'There is an empty slot (slot ' + (k + 1) + ') in the middle of your chain. Energy has nowhere to go.' };
      }
      break;
    }
    if (SOURCES[id]) {
      if (L.start || k !== 0) return { ok:false, steps, brokeAt:k, msg:'An energy source can only go in the very first slot.' };
      energy = SOURCES[id].out;
      steps.push({ slot:k, id, kind:'start', out:energy, amount });
      continue;
    }
    const p = PARTS[id];
    if (p.dud) {
      steps.push({ slot:k, id, kind:'part', ok:false, dud:true });
      return { ok:false, steps, brokeAt:k, msg:p.name + ' is a fake part. It can\u2019t pass energy along, so take it out and try a real one.' };
    }
    if (energy === null) {
      return { ok:false, steps, brokeAt:k, msg:'Start the chain with an energy source in slot 1.' };
    }
    const prevId = k === 0 ? L.start : chain[k - 1];
    if (p.from && !p.from.includes(prevId)) {
      const names = p.from.map(f => (SOURCES[f] || PARTS[f]).name.toLowerCase()).join(' or ');
      steps.push({ slot:k, id, kind:'part', ok:false, got:energy, need:p.in, special:true });
      return { ok:false, steps, brokeAt:k, msg: p.name + ' only works right after: ' + names + '.' };
    }
    if (p.in !== energy) {
      steps.push({ slot:k, id, kind:'part', ok:false, got:energy, need:p.in });
      return { ok:false, steps, brokeAt:k,
        msg: p.name + ' needs ' + ENERGY[p.in].name + ' energy, but it is getting ' + ENERGY[energy].name + ' energy.' };
    }
    const before = amount;
    if (L.leak) amount = amount * p.eff;
    energy = p.out;
    steps.push({ slot:k, id, kind:'part', ok:true, in:p.in, out:energy, amount, lost:before - amount });
  }
  if (energy === null) return { ok:false, steps, brokeAt:0, msg:'Your chain is empty. Add an energy source and some parts.' };
  const goal = GOALS[L.goal];
  if (energy !== goal.needs) {
    return { ok:false, steps, goalFail:true, final:energy, amount,
      msg:'Your chain ends with ' + ENERGY[energy].name + ' energy, but \u201C' + goal.name + '\u201D needs ' + ENERGY[goal.needs].name + ' energy.' };
  }
  if (L.leak && amount < L.need) {
    return { ok:false, steps, goalFail:true, lowEnergy:true, final:energy, amount,
      msg:'Right kind of energy, but only ' + fmt(amount) + ' units arrived. The goal needs at least ' + L.need + '. Too much leaked out. Try fewer steps or more efficient parts.' };
  }
  return { ok:true, steps, final:energy, amount };
}

function initChain(L) {
  const c = new Array(L.slots).fill(null);
  if (L.fixed) Object.keys(L.fixed).forEach(i => { c[+i] = L.fixed[i]; });
  return c;
}

if (typeof module !== 'undefined') module.exports = { ROSTER, ENERGY, SOURCES, PARTS, GOALS, BUILD, SPOT, LEARN, simulate, initChain };

  let seed = 0;

  function pick(n, exclude) {

    return pool.slice(0, n);
  }

  function murphySVG(happy) {
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<ellipse cx="21" cy="47" rx="14" ry="27" fill="#7A4B2A" transform="rotate(12 21 47)"/>' +

    const g = (PICS[mood] && PICS[mood].length) ? PICS[mood] : PICS.neutral;

  }

  /* ---------- SPOT IT ---------- */
  function startSpot(id) {
    const lvl = SPOT.find(l => l.id === id);

    seed++; S.screen = 'spot'; render();
  }
  function renderSpot() {
    const sp = S.spot, q = sp.lvl.qs[sp.i], total = sp.lvl.qs.length, ans = new Set(q.ans);
    const opts = q.opts.map(o => typeof o === 'string' ? { id:o, energy:true } : o);
    const optHTML = opts.map(o => {
      let cls = o.energy ? 'energy' : 'text';
      if (sp.done && ans.has(o.id)) cls += ' right'; else if (sp.bad.has(o.id)) cls += ' wrong'; else if (sp.sel.has(o.id)) cls += ' sel';
      const style = o.energy ? ' style="--c:' + ENERGY[o.id].color + ';--ink-c:' + ENERGY[o.id].ink + '"' : '';
      return '<button class="opt ' + cls + '" data-act="opt" data-id="' + o.id + '"' + style + ' ' + (sp.done || sp.bad.has(o.id) ? 'disabled' : '') + ' aria-pressed="' + sp.sel.has(o.id) + '">' + esc(o.energy ? ENERGY[o.id].name : o.label) + '</button>';
    }).join('');
    let bubble;
    if (sp.done) {
      const lead = sp.revealed ? 'Here\u2019s the answer. ' : (sp.firstTry ? ['Yes! ', 'Nice one, ' + esc(meName()) + '! ', 'Exactly! '][sp.i % 3] : 'You got it. ');
      bubble = say(lead + fill(q.why, sp.names), 60, sp.revealed ? '' : 'good', sp.revealed ? 'hmm' : 'happy', sp.lvl.id + sp.i + 'd');
    } else if (sp.msg) bubble = say(sp.msg, 60, 'bad', 'hmm', sp.lvl.id + sp.i + 'w' + sp.tries);
    else bubble = say(q.multi ? 'Tap every one that applies, then press Check.' : 'Tap the best answer.', 60, '', 'neutral', sp.lvl.id + sp.i);
    const last = sp.i === total - 1;
    return '<section><div class="sec" style="margin-top:6px"><h2>Spot It: ' + esc(sp.lvl.title) + '</h2></div>' +
      '<div class="prog">' + sp.lvl.qs.map((_, k) => '<i class="' + (k < sp.i ? 'done' : k === sp.i ? 'cur' : '') + '"></i>').join('') + '</div>' +
      '<div class="qcard"><p class="q">' + fill(q.t, sp.names) + '</p><div class="opts">' + optHTML + '</div>' +
      '<div class="actions">' +
      (!sp.done && q.multi ? '<button class="btn primary" data-act="check" ' + (sp.sel.size ? '' : 'disabled') + '>Check answer</button>' : '') +
      (sp.done ? '<button class="btn primary" data-act="next">' + (last ? 'Finish level' : 'Next question') + '</button>' : '') + '</div></div>' + bubble + '</section>';
  }
  function spotPick(id) {
    const sp = S.spot, q = sp.lvl.qs[sp.i];
    if (sp.done) return;
    if (q.multi) { sp.sel.has(id) ? sp.sel.delete(id) : sp.sel.add(id); sp.msg = ''; render(); }
    else { sp.sel = new Set([id]); spotCheck(); }
  }
  function spotCheck() {
    const sp = S.spot, q = sp.lvl.qs[sp.i], ans = new Set(q.ans), sel = sp.sel;
    const correct = sel.size === ans.size && [...sel].every(x => ans.has(x));
    if (correct) { sp.done = true; sp.firstTry = sp.tries === 0; sp.msg = ''; }
    else {
      sp.wrong++; sp.tries++;
      if (q.multi) {
        const right = [...sel].filter(x => ans.has(x)).length, extra = sel.size - right;
        sp.msg = 'You found ' + right + ' of ' + ans.size + (extra ? ' and picked ' + extra + (extra === 1 ? ' that doesn\u2019t' : ' that don\u2019t') + ' belong' : '') + '. Change your picks and try again.';
      } else { sel.forEach(x => sp.bad.add(x)); sp.msg = 'Not quite. ' + fill(q.tip, sp.names); sp.sel = new Set(); }
      if (sp.tries >= 2) { sp.done = true; sp.revealed = true; sp.msg = ''; }
    }
    render();
  }
  function spotNext() {
    const sp = S.spot;
    if (sp.i < sp.lvl.qs.length - 1) { sp.i++; sp.tries = 0; sp.sel = new Set(); sp.bad = new Set(); sp.done = false; sp.revealed = false; sp.msg = ''; render(); return; }
    const stars = sp.wrong <= 1 ? 3 : sp.wrong <= 3 ? 2 : 1;
    S.stars[sp.lvl.id] = Math.max(S.stars[sp.lvl.id] || 0, stars);
    const lines = [stars === 3 ? 'Wow, ' + esc(meName()) + '! Murphy is wagging his tail.' : stars === 2 ? 'Nice work, ' + esc(meName()) + '. Replay for a perfect score!' : 'You finished it, ' + esc(meName()) + '. Look back at your energy notes and try again for more stars.',
      sp.wrong + (sp.wrong === 1 ? ' mistake' : ' mistakes') + ' this level.'];
    S.overlay = { title:'Level complete!', stars, lines, id:sp.lvl.id };
    render();
  }

  /* ---------- BUILD IT ---------- */
  function startBuild(id) {
    const lvl = BUILD.find(l => l.id === id);
    S.build = { lvl, names:pick(3, S.me), chain:initChain(lvl), fails:0, hinted:false, peeked:false, revealed:false, running:false, msg:'', msgCls:'', marks:{}, amts:{}, sum:null, now:'', last:null };
    const tip = ' The energy types are hidden, so think about what each part does. Press \u201CShow energy types\u201D if you get stuck.';
    S.build.msg = (lvl.blind ? 'Expert level: even the \u201Ckeeps %\u201D numbers are hidden. Use what you know about energy.' :
      lvl.leak ? 'Heads up: each part keeps only some of the energy (see \u201Ckeeps %\u201D). The rest leaks out as heat and sound. Drag parts into the slots, then press Play.' :
      'Drag parts into the slots (or tap a part to add it), then press Play. Watch out: some parts are fakes!') + tip;
    seed++; S.screen = 'build'; render();
  }
  function pieceHTML(id, drag, B) {
    const src = SOURCES[id], d = src || PARTS[id];
    let io;
    if (!B.revealed) io = '<div class="mystery">?</div>';
    else if (d.dud) io = '<div class="io"><span class="chip sm" style="--c:#C9D3E0;--ink-c:#1B2A49">Does nothing</span></div>';
    else io = '<div class="io">' + (src ? '<span class="dn">gives</span>' + chip(d.out, 'sm') : chip(d.in, 'sm') + '<span class="dn">\u2193</span>' + chip(d.out, 'sm')) + '</div>';
    const showEff = !src && !d.dud && B.lvl.leak && (!B.lvl.blind || B.revealed);
    return '<div class="piece" ' + (drag ? 'data-drag="' + drag + '" tabindex="0" role="button" aria-label="' + esc(d.name) + '"' : '') + '><div class="ic">' + d.icon + '</div><div class="nm">' + esc(d.name) + '</div>' + io +
      (showEff ? '<div class="eff">keeps ' + Math.round(d.eff * 100) + '%</div>' : '') +
      (d.note ? '<div class="note">' + esc(d.note) + '</div>' : '') + '</div>';
  }
  function renderBuild() {
    const B = S.build, L = B.lvl, goal = GOALS[L.goal], placed = new Set(B.chain.filter(Boolean));
    const tray = L.tray.filter(id => !placed.has(id));
    let chain = '';
    if (L.start) {
      const s = SOURCES[L.start];
      chain += '<div class="node" id="n--1"><span class="tag">Start</span><div class="piece"><div class="ic">' + s.icon + '</div><div class="nm">' + esc(s.name) + '</div><div class="io"><span class="dn">gives</span>' + (B.revealed ? chip(s.out, 'sm') : '<span class="qmark">?</span>') + '</div></div></div><span class="arrow">\u279C</span>';
    }
    B.chain.forEach((id, i) => {
      const fixed = L.fixed && L.fixed[i];
      if (fixed) chain += '<div class="node slot locked" data-slot="' + i + '" id="n-' + i + '"><span class="lock" title="Locked in place">\uD83D\uDD12</span>' + pieceHTML(id, null, B) + '</div>';
      else if (id) chain += '<div class="node slot filled" data-slot="' + i + '" id="n-' + i + '">' + pieceHTML(id, 'slot:' + i, B) + '</div>';
      else chain += '<div class="node slot empty" data-slot="' + i + '" id="n-' + i + '">' + (i === 0 && !L.start ? 'Drop an<br>energy source' : 'Drop a<br>part here') + '</div>';
      if (i < B.chain.length - 1) chain += '<span class="arrow">\u279C</span>';
    });
    chain += '<div class="endgrp"><span class="arrow">\u279C</span><div class="node" id="n-goal"><span class="tag">Goal</span><div class="piece"><div class="ic">' + goal.icon + '</div><div class="nm">' + esc(goal.name) + '</div><div class="io"><span class="dn">needs</span>' + (B.revealed ? chip(goal.needs, 'sm') : '<span class="qmark">?</span>') + '</div>' + (L.leak ? '<div class="eff">at least ' + L.need + ' units</div>' : '') + '</div></div></div>';
    let sum = '';
    if (B.sum) {
      const pct = Math.max(0, Math.min(100, B.sum.got)), enough = B.sum.got >= L.need;
      sum = '<div class="meter" role="img" aria-label="' + B.sum.got + ' units delivered, ' + B.sum.lost + ' leaked"><div class="got" style="width:' + pct + '%">' + (pct > 14 ? B.sum.got + ' delivered' : '') + '</div><div class="lost" style="width:' + (100 - pct) + '%">' + (100 - pct > 14 ? B.sum.lost + ' leaked as heat &amp; sound' : '') + '</div></div>' +
        '<div class="meterkey">' + B.sum.got + ' delivered + ' + B.sum.lost + ' leaked = 100 units. Energy is never destroyed, it just changes form. ' + (enough ? '' : 'The goal needs at least ' + L.need + '.') + '</div>';
    }
    return '<section><div class="sec" style="margin-top:6px"><h2>Build It: ' + esc(L.title) + '</h2></div>' + say(fill(L.story, B.names), 64, '', 'neutral', L.id) +
      '<p class="help">Drag a part into a slot, or tap it to add it. Tap a part in the chain to take it back out. Some parts in the tray are fakes that do nothing.' + (L.fixed ? ' \uD83D\uDD12 Locked parts can\u2019t be moved.' : '') + '</p>' +
      '<div class="chain" id="chain">' + chain + '</div><div class="now" id="now" aria-live="polite">' + esc(B.now) + '</div>' +
      '<div class="actions"><button class="btn primary" data-act="play" ' + (B.running ? 'disabled' : '') + '>\u25B6 Play</button><button class="btn" data-act="breset" ' + (B.running ? 'disabled' : '') + '>Reset</button><button class="btn" data-act="hint" ' + (B.running ? 'disabled' : '') + '>Ask Murphy for a hint</button><button class="btn" data-act="peek" ' + (B.running || B.revealed ? 'disabled' : '') + '>' + (B.revealed ? 'Energy types shown' : 'Show energy types') + '</button></div>' +
      '<div class="readout">' + say(B.msg, 56, B.msgCls, B.msg.indexOf('Hint:') === 0 ? 'hint' : moodOf(B.msgCls), L.id + B.fails + B.msg.length) + sum + '</div>' +
      '<div class="sec" style="margin:18px 0 4px"><h3>Parts tray</h3></div><div class="tray" id="tray">' +
      (tray.length ? tray.map(id => '<div>' + pieceHTML(id, 'tray:' + id, B) + '</div>').join('') : '<span class="empty-note">All parts are in the machine.</span>') + '</div></section>';
  }
  function applyMarks() {
    const B = S.build;
    Object.keys(B.marks).forEach(k => { const el = document.getElementById('n-' + k); if (el) el.classList.add(B.marks[k]); });
    Object.keys(B.amts).forEach(k => {
      const el = document.getElementById('n-' + k); if (!el || el.querySelector('.amt')) return;
      const a = document.createElement('span'); a.className = 'amt'; a.textContent = B.amts[k]; el.appendChild(a);
    });
  }
  function clearMarks() { const B = S.build; B.marks = {}; B.amts = {}; B.sum = null; B.now = ''; }

  /* drag & drop (pointer events, so it works on iPads) */
  function bindBuild() {
    app.querySelectorAll('[data-drag]').forEach(el => {
      el.addEventListener('pointerdown', onDown);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapPiece(el.dataset.drag); } });
    });
  }
  function onDown(e) {
    const B = S.build; if (B.running || (e.button && e.button > 0)) return;
    const el = e.currentTarget, from = el.dataset.drag, sx = e.clientX, sy = e.clientY;
    const rect = el.getBoundingClientRect(); let ghost = null, moved = false;
    const move = ev => {
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
        moved = true; ghost = el.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = rect.width + 'px'; ghost.removeAttribute('data-drag'); document.body.appendChild(ghost); el.classList.add('lifted');
      }
      if (moved) {
        ghost.style.left = (ev.clientX - (sx - rect.left)) + 'px'; ghost.style.top = (ev.clientY - (sy - rect.top)) + 'px';
        document.querySelectorAll('.node.over').forEach(n => n.classList.remove('over'));
        const t = document.elementFromPoint(ev.clientX, ev.clientY), slot = t && t.closest('[data-slot]');
        if (slot && !slot.classList.contains('locked')) slot.classList.add('over');
      }
    };
    const up = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      document.querySelectorAll('.node.over').forEach(n => n.classList.remove('over'));
      if (ghost) ghost.remove();
      if (!moved) { tapPiece(from); return; }
      const t = document.elementFromPoint(ev.clientX, ev.clientY), slot = t && t.closest('[data-slot]'), inTray = !!(t && t.closest('#tray'));
      dropPiece(from, slot ? +slot.dataset.slot : null, inTray);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }
  function tapPiece(from) {
    const B = S.build, L = B.lvl; clearMarks();
    if (from.startsWith('slot:')) { B.chain[+from.slice(5)] = null; B.msg = 'Part removed. Rebuild your chain and press Play.'; B.msgCls = ''; }
    else {
      const id = from.slice(5);
      let target = -1;
      for (let i = 0; i < B.chain.length; i++) if (!B.chain[i] && !(L.fixed && L.fixed[i])) { target = i; break; }
      if (target < 0) { B.msg = 'All the slots are full. Tap a part in the chain to take it out first.'; B.msgCls = ''; render(); return; }
      B.chain[target] = id;
    }
    render();
  }
  function dropPiece(from, slotIdx, inTray) {
    const B = S.build, L = B.lvl; clearMarks();
    const fromTray = from.startsWith('tray:'), fi = fromTray ? -1 : +from.slice(5), id = fromTray ? from.slice(5) : B.chain[fi];
    if (slotIdx === null) { if (!fromTray && inTray) B.chain[fi] = null; render(); return; }
    if (L.fixed && L.fixed[slotIdx]) { render(); return; }
    if (fromTray) B.chain[slotIdx] = id;
    else if (fi !== slotIdx) { const prev = B.chain[slotIdx]; B.chain[slotIdx] = id; B.chain[fi] = prev; }
    render();
  }

  /* play it */
  async function play() {
    const B = S.build, L = B.lvl; if (B.running) return;
    clearMarks();
    const sim = simulate(L, B.chain);
    B.running = true; B.msg = 'Watch the energy travel\u2026'; B.msgCls = ''; render();
    const chainEl = document.getElementById('chain'), k = reduceMotion ? 0.15 : 1;
    const node = slot => document.getElementById('n-' + (slot === 'goal' ? 'goal' : slot));
    const orb = document.createElement('div'); orb.className = 'orb'; chainEl.appendChild(orb);
    const moveOrb = el => { orb.style.left = (el.offsetLeft + el.offsetWidth / 2 - 15) + 'px'; orb.style.top = (el.offsetTop + el.offsetHeight / 2 - 15) + 'px'; };
    const nowEl = () => document.getElementById('now');
    const first = sim.steps.length ? node(sim.steps[0].slot) : node(0);
    orb.style.transition = 'none'; moveOrb(first); orb.offsetWidth; orb.style.transition = '';

    for (const st of sim.steps) {
      const el = node(st.slot); moveOrb(el); await wait(650 * k);
      const d = SOURCES[st.id] || PARTS[st.id];
      if (st.kind === 'start') {
        B.marks[st.slot] = 'ok'; if (B.revealed) orb.style.background = ENERGY[st.out].color; B.now = d.name + (B.revealed ? ' gives ' + ENERGY[st.out].name + ' energy.' : ' is where the energy starts.');
      } else if (st.ok) {
        B.marks[st.slot] = 'ok'; if (B.revealed) orb.style.background = ENERGY[st.out].color;
        if (L.leak) { B.amts[st.slot] = fmt(st.amount) + ' left'; }
        B.now = d.name + ': ' + (B.revealed ? ENERGY[st.in].name + ' \u2192 ' + ENERGY[st.out].name : 'the energy passes through') + (L.leak ? ' (' + fmt(st.lost) + ' leaked)' : '');
      } else { B.marks[st.slot] = 'bad'; B.now = d.name + ' stopped. ' + (st.dud ? 'That one is a fake!' : st.special ? 'Wrong partner.' : 'Wrong energy type.'); }
      applyMarks(); if (nowEl()) nowEl().textContent = B.now;
      if (!st.ok && st.kind === 'part') break;
      await wait(420 * k);
    }
    if (sim.brokeAt !== undefined && !sim.steps.some(s => s.slot === sim.brokeAt && s.kind === 'part' && !s.ok) && !sim.goalFail) {
      const el = node(sim.brokeAt); if (el) { moveOrb(el); B.marks[sim.brokeAt] = 'bad'; applyMarks(); await wait(500 * k); }
    }
    if (sim.ok || sim.goalFail) {
      moveOrb(node('goal')); await wait(650 * k); B.marks.goal = sim.ok ? 'ok' : 'bad'; applyMarks();
      B.now = sim.ok ? GOALS[L.goal].name + '!' : B.revealed ? 'The goal needs ' + ENERGY[GOALS[L.goal].needs].name + ' energy.' : sim.lowEnergy ? 'Not enough energy arrived.' : 'The goal needs a different kind of energy.';
      if (nowEl()) nowEl().textContent = B.now; await wait(500 * k);
    }
    if (L.leak && (sim.ok || sim.goalFail)) B.sum = { got:fmt(sim.amount), lost:fmt(100 - sim.amount) };
    B.running = false; orb.remove();
    if (sim.ok) {
      B.msg = 'It works! ' + esc(meName()) + ', that is a great machine.'; B.msgCls = 'good';
      let stars = B.fails >= 2 ? 1 : B.fails === 1 ? 2 : 3; if (B.hinted || B.peeked) stars = Math.max(1, stars - 1);
      S.stars[L.id] = Math.max(S.stars[L.id] || 0, stars);
      const icons = B.chain.filter(Boolean).map(id => (SOURCES[id] || PARTS[id]).icon);
      if (L.start) icons.unshift(SOURCES[L.start].icon); icons.push(GOALS[L.goal].icon);
      const lines = [L.leak ? fmt(sim.amount) + ' of 100 units reached the goal. ' + fmt(100 - sim.amount) + ' leaked as heat and sound. None was destroyed.' : 'Every handoff matched, so the energy made it all the way.',
        stars === 3 ? 'First try with no hints: perfect!' : (B.hinted || B.peeked) ? 'You asked for help (a hint or the energy types), so one star was lost.' : 'Failed attempts: ' + B.fails + '.'];
      render(); await wait(500 * k);
      S.overlay = { title:'It works!', stars, lines, id:L.id, chainline:icons.join(' \u279C ') }; render();
    } else {
      B.fails++;
      let m = sim.msg;
      if (!B.revealed) {
        const last = sim.steps[sim.steps.length - 1];
        if (last && last.kind === 'part' && last.ok === false && !last.special && !last.dud) m = PARTS[last.id].name + ' can\u2019t use the energy it is getting from the step before it. Think about what kind of energy each part makes.';
        else if (sim.goalFail && !sim.lowEnergy) m = 'Your chain ends with the wrong kind of energy for \u201C' + GOALS[L.goal].name + '\u201D. Think about what kind of energy the goal needs.';
      }
      if (B.fails >= 3 && !B.revealed) { B.revealed = true; m += ' That is 3 misses, so I am showing the energy types now.'; }
      B.msg = m; B.msgCls = 'bad'; render();
    }
  }
  function buildHint() {
    const B = S.build; B.hinted = true; clearMarks();
    B.msg = 'Hint: ' + B.lvl.hint; B.msgCls = ''; render();
  }
  function peekTypes() {
    const B = S.build; if (B.revealed) return;
    B.revealed = true; B.peeked = true; clearMarks();
    B.msg = 'Here are the energy types. Match what each part gives out to what the next part takes in.'; B.msgCls = ''; render();
  }

  /* ---------- overlay ---------- */
  function overlayHTML() {
    const o = S.overlay, nxt = nextLevelId(o.id);
    return '<div class="ov" role="dialog" aria-modal="true"><div class="modal"><div style="display:flex;justify-content:center;margin-bottom:6px">' + murphy(96, 'happy', 'ov' + o.id) + '</div><h2>' + esc(o.title) + '</h2>' + (o.chainline ? '<div class="chainline">' + o.chainline + '</div>' : '') + starsHTML(o.stars) +
      o.lines.map(l => '<p>' + l + '</p>').join('') +
      '<div class="actions">' + (nxt && (S.unlockAll || unlocked(nxt)) ? '<button class="btn primary" data-act="start" data-id="' + nxt + '">Next level</button>' : '') +
      '<button class="btn" data-act="start" data-id="' + o.id + '">Play again</button><button class="btn" data-act="map">Level map</button></div></div></div>';
  }

  /* ---------- events ---------- */
  app.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const act = t.dataset.act, id = t.dataset.id;
    S.overlay = null;
    switch (act) {
      case 'home': S.screen = 'home'; render(); break;
      case 'map': S.screen = 'map'; render(); break;
      case 'learn': S.screen = 'learn'; render(); break;
      case 'review': S.screen = 'review'; render(); break;
      case 'notesdone': S.notesDone = true; render(); break;
      case 'start': id[0] === 's' ? startSpot(id) : startBuild(id); break;
      case 'opt': spotPick(id); break;
      case 'check': spotCheck(); break;
      case 'next': spotNext(); break;
      case 'play': play(); break;
      case 'breset': { const B = S.build; B.chain = initChain(B.lvl); clearMarks(); B.msg = 'Fresh start. Drag parts into the slots, then press Play.'; B.msgCls = ''; render(); break; }
      case 'hint': buildHint(); break;
      case 'peek': peekTypes(); break;
      case 'reset': if (confirm('Reset all stars and progress?')) { S.stars = {}; S.unlockAll = false; } render(); break;
    }
  });
  app.addEventListener('change', e => { if (e.target.id === 'who') { S.me = e.target.value; render(); } });

  render();
})();

</script>
</body>
</html>
